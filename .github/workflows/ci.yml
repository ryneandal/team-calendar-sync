name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Offline regression tests
        run: swift test
      - name: Build release app
        run: bash scripts/build-app.sh
      - name: Verify bundle signature and metadata
        run: |
          codesign --verify --deep --strict --verbose=2 "build/Team Calendar.app"
          plutil -lint "build/Team Calendar.app/Contents/Info.plist"
      - name: Check maintenance scripts
        run: |
          bash -n scripts/build-app.sh
          python3 -m py_compile scripts/*.py
          git diff --check
